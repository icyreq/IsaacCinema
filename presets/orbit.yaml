# Go2 + ARX5: 3 s close-up, 7 s orbit and pullback, 10 s stationary camera.
robot:
  checkpoint: models/best_agent.pt
  control: go2_arx5/environment.yaml
  actor:
    backbone: [512, 256]
    leg_branch: [128]
    arm_branch: [128]
    leg_actions: 12
    arm_actions: 6
    activation: elu

scene:
  num_envs: 4096
  spacing: 3.0
  seed: 42
  warmup: 2.0
  ee_command_interval: [1.0, 2.0]
  velocity_command_interval: [2.0, 3.0]

camera:
  mode: orbit                   # orbit, single, or crowd
  closeup_seconds: 3.0
  move_seconds: 7.0
  hold_seconds: 10.0
  close_distance: 1.15
  close_direction: [0.65, -1.3, 0.95]
  target_height: 0.08
  orbit_degrees: 90.0
  lateral_distance: 8.0
  end_horizontal_distance: 12.0
  end_height: 10.0

lighting:
  intensity: 20000.0
  height: 3.0
  radius: 0.35
  color: [1.0, 0.98, 0.94]
  cone_angle: 32.0
  cone_softness: 0.15
  ambient: 50.0
  ambient_color: [0.85, 0.9, 1.0]

render:
  width: 3840
  height: 2160
  samples_per_pixel: 16
  crf: 14
  encoder_preset: medium
